i18n:
  tr:
    tagline: Kesim, oluk ve freze tek kafada, tabakadan bitmiş işe tek durakta
    summary: >-
      MK-1612, 1600 × 1200 mm vakumlu tablasıyla baskı sonrası bütün kesim
      işlerini tek makinede toplar. Tangansiyel bıçak, osilasyonlu bıçak, oluk
      açma ve freze modüllerinden üçü aynı anda kafada durur; takım değişimi
      kalibrasyon gerektirmez. Araba 1000 mm/s hıza ve 1 G ivmeye kadar çalışır,
      dikey kuvvet 200 N'a çıkar, tekrarlanabilirlik ± 0,05 mm'dir. Dört bağımsız
      vakum bölgesi sayesinde tek levha da, tam tabla iş de aynı pompa yüküyle
      sabitlenir. Optik iz okuma, baskıdaki boyut kaymasını kesim yoluna taşır.
    features:
      - term: Bölgesel Vakum Kontrolü
        body: >-
          Tabla dört bağımsız bölgeye ayrılmıştır. Tek bir 60 × 40 cm levhayı
          sabitlemek için bütün tablayı vakumlamak zorunda kalmaz, pompa yükünü
          ve elektrik tüketimini iş boyutuna göre ayarlarsınız.
      - term: MavenSight Optik İz Okuma
        body: >-
          Kafadaki kamera baskıdaki register işaretlerini okur ve malzemedeki
          gerilmeyi kesim yoluna X/Y ölçekleme olarak taşır. Eko solvent
          ısıtıcılarından geçmiş bir branda veya folyoda kontur kaymasının tek
          gerçek çözümü budur.
      - term: TriTool Üçlü Takım Kafası
        body: >-
          Tangansiyel bıçak, osilasyonlu bıçak, oluk açma, freze ve V-kesim
          modüllerinden üçü kafada aynı anda takılı durur. Tek noktadan bağlantı
          sayesinde modül değişimi dakikalar sürer ve takım sıfır noktası korunur.
      - term: MavenPanel Sürekli Besleme
        body: >-
          Kıskaçlı ilerletme ve konveyör opsiyonuyla tabla boyundan uzun işler
          panel panel kesilir; toplam iş boyu 50 m'ye kadar çıkar. Uzun bir totem
          gövdesini parçalara bölüp ek yeri yönetmek yerine tek dosyada bitirirsiniz.
    faq:
      - q: MK-1612 hangi işler için doğru makine, hangileri için değil?
        a: >-
          Dekota, fotoblok, oluklu mukavva ve alüminyum kompozit gibi rijit
          malzemeleri karışık şekilde kesen atölyeler için doğru makine. Yalnızca
          rulo folyo kesiyorsanız yanlış makine: o iş için rulo besleyen bir
          kesici plotter hem çok daha ucuz hem daha hızlıdır. Baskı ve kesimi
          aynı makinede istiyorsanız MS-1600 PC baskı-kesim modeline bakın.
      - q: Trifaze elektrik şart mı?
        a: >-
          Pratikte evet. Makine 3 × 380–400 V + N, maksimum 20 A besleme ile
          teslim edilir; tek fazlı varyantı vardır ancak yükün büyük bölümü vakum
          pompasıdır ve tek fazda pompa kapasitesi sınırlanır. Panonun makineye
          kadar çekilmesi ve kaçak akım koruması kurulum öncesi sizin
          tarafınızdadır; ön keşifte birlikte kontrol ediyoruz.
      - q: Gerçekten 1000 mm/s hızda mı kesiyor?
        a: >-
          1000 mm/s araba tepe hızıdır, ortalama kesim hızı değil. Gerçek verim
          metrekare başına düşen kesim yolu uzunluğuna bağlıdır: 30 cm'lik
          harflerde araba düz kenarlarda tepe hıza çıkar, 3 cm'lik etiket
          konturlarında ivmelenme bitmeden yavaşlamaya başlar. Küçük konturlu
          işlerde 1 G ivme, tepe hızdan daha belirleyicidir. Verdiğimiz m²/sa
          değerleri tam tabla iş içindir.
      - q: Freze modülü CNC router yerine geçer mi?
        a: >-
          Hayır. Freze modülü ince dekota, pleksi ve alüminyum kompozit levhaları
          temiz kenarla kesmek içindir; kalın ahşap, derin paso ve 2,5 boyutlu
          oyma işleri CNC router işidir. Freze ile çalışacaksanız toz emiş ünitesi
          zorunludur ve fiyata dahil değildir.
      - q: Başka marka bir baskı makinesiyle çalışır mı?
        a: >-
          Evet. Kesim yolu ONYX, Caldera veya SAi Flexi tarafında oluşturulur;
          makinenin tek beklentisi baskıya register işaretlerinin doğru
          yerleştirilmiş olmasıdır. Marka fark etmeksizin, RIP çıktısındaki işaret
          düzeni bir kez ayarlandıktan sonra iş akışı değişmez.
      - q: Sarf maliyeti ne kadar tutar?
        a: >-
          Bıçak ucu ve kesim altlığı sarf malzemedir. Oluklu mukavva ve dekotada
          uç ömrü, yapışkanlı folyo kesimine göre belirgin biçimde kısadır;
          osilasyonlu takımda uç değişimi rutin bir vardiya işidir. Altlık da
          malzemeye göre yıpranır ve periyodik olarak değişir. Makine bütçesini
          çıkarırken bu iki kalemi aylık sarf olarak hesaba katın.
    alternateName:
      - flatbed kesim makinası
      - dijital kesim makinası
