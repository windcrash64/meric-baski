      - flatbed kesici
      - dijital kesim sistemi
  en:
    tagline: Knife, crease and router in one head, from sheet to finished part in one stop
    summary: >-
      The MK-1612 gathers post-print finishing onto one 1600 × 1200 mm vacuum bed.
      Three of the tangential knife, oscillating knife, creasing and routing
      modules sit in the head at once, and a tool change needs no recalibration.
      The carriage runs to 1000 mm/s with acceleration up to 1 G, down-force
      reaches 200 N, repeatability is ± 0.05 mm. Four independent vacuum zones
      hold a single sheet at the same pump load as a full bed, and optical mark
      reading carries print-side drift into the cut path.
    features:
      - term: Zoned Vacuum Control
        body: >-
          The bed is split into four independent zones, so holding a single
          60 × 40 cm sheet does not require pulling vacuum across the whole table.
          Pump load and power draw scale with the job, not the machine.
      - term: MavenSight Optical Mark Reading
        body: >-
          A head-mounted camera reads the registration marks in the print and
          carries material stretch into the cut path as X/Y scaling. On banner or
          vinyl that has been through eco-solvent heaters, this is the only real
          answer to contour drift.
      - term: TriTool Three-Module Head
        body: >-
          Any three of the tangential knife, oscillating knife, creasing, routing
          and V-cut modules stay fitted at the same time. Single-point fastening
          makes a module change a matter of minutes and preserves the tool origin.
      - term: MavenPanel Continuous Feed
        body: >-
          With advance clamps and the conveyor option, work longer than the bed is
          cut panel by panel up to a total job length of 50 m. A tall totem body is
          finished as one file instead of being split and joined.
    faq:
      - q: What is the MK-1612 the right machine for — and what is it wrong for?
        a: >-
          Shops cutting a mixed diet of rigid material: foam PVC, foam board,
          corrugated and aluminium composite. It is the wrong machine if you only
          cut roll vinyl — a roll-fed cutting plotter is both far cheaper and
          faster at that. If you want printing and cutting on one machine, look at
          the MS-1600 PC print-and-cut instead.
      - q: Is three-phase power mandatory?
        a: >-
          In practice yes. The machine ships for 3 × 380–400 V + N at a maximum of
          20 A. A single-phase variant exists, but most of the load is the vacuum
          pump and single-phase caps pump capacity. Bringing the panel to the
          machine and preparing residual-current protection is your responsibility
          before installation; we walk through it at the pre-install survey.
      - q: Does it really cut at 1000 mm/s?
        a: >-
          1000 mm/s is peak carriage speed, not average cutting speed. Real
          throughput follows the length of cut path per square metre: on 30 cm
          letters the carriage reaches peak speed along the straights, on 3 cm
          label contours it starts decelerating before acceleration has finished.
          On small contours the 1 G acceleration matters more than peak speed. Our
          m²/h figures are for a full bed.
      - q: Does the routing module replace a CNC router?
        a: >-
          No. The router module is for clean-edged cuts in thin foam PVC, acrylic
          and aluminium composite; thick timber, deep passes and 2.5D carving are
          CNC router work. If you intend to route, a dust extraction unit is
          mandatory and is not included in the price.
      - q: Will it work with another brand of printer?
        a: >-
          Yes. The cut path is produced in ONYX, Caldera or SAi Flexi; all the
          machine expects is registration marks placed correctly in the print.
          Whatever the printer brand, once the mark layout in the RIP output is set
          up the workflow does not change.
      - q: What do the consumables cost?
        a: >-
          Blades and the cutting underlay are consumables. Blade life on corrugated
          and foam PVC is markedly shorter than on adhesive vinyl, and on the
          oscillating tool a blade change is routine shift work. The underlay also
          wears by material and is replaced periodically. Budget both as a monthly
          consumable line, not as a one-off.
    alternateName:
      - flatbed cutter
      - digital die-less cutting system
      - flatbed cutting table
