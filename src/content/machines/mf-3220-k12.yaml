      - büyük ebat uv baskı makinası
      - konica kafalı uv baskı makinesi
  en:
    tagline: Full-size sheets printed in one piece, shifts that never stop
    summary: >-
      The MF-3220 K12 prints a full-size composite or acrylic sheet in one piece
      on its 3200 × 2000 mm bed. A Konica Minolta KM1024i array configurable from
      four to eighteen heads delivers 75–84 m²/h at four passes, and six
      independent vacuum zones let one half of the table print while the other is
      being reloaded — this is a machine that genuinely runs with two operators.
      Water-cooled LED-UV curing holds lamp temperature steady through the shift,
      and the white channel circulates continuously.
    features:
      - term: Zoned Vacuum Control
        body: >-
          The bed is split into six independent zones. Three can print while the
          other three are cleared and reloaded; on a 3.2 metre table the real
          loss is never print time, it is the minutes the bed spends empty.
      - term: Water-Cooled LED-UV
        body: >-
          Unlike air-cooled lamps, temperature stays constant across a full shift.
          With an eighteen-head array the curing energy rises with the ink laid
          down, which makes water cooling a working condition in this class
          rather than a comfort feature.
      - term: MavenFlow White Circulation
        body: >-
          White ink circulates through the channel even when the machine is idle.
          There is no way to recover pigment that has settled in a five-litre bulk
          supply, which is exactly why circulation matters more as tank volume
          grows.
      - term: AutoGap Height Sensor
        body: >-
          Media height is measured automatically between 0 and 100 mm and the head
          gap is set from it. The anti-collision sensor catches the bow in the
          middle of a 3.2 metre sheet the instant the carriage touches it.
      - term: MavenGuard Nozzle Recovery
        body: >-
          A blocked nozzle is compensated by its neighbours so the job finishes
          without stopping the run. Recovery is a way to finish the shift, not a
          repair — head cleaning and filter maintenance remain the actual fix.
    faq:
      - q: Who is the MF-3220 K12 right for, and who is it wrong for?
        a: >-
          It is right for shops printing more than 60 m² of rigid material a day —
          signage, facade panels, furniture components. Below that the machine
          does not repay itself and the MF-2513 R8 is the smarter buy on both
          capital and running cost. If you cannot provide 45 m² of clear floor,
          3.5 m of ceiling and crane access, there is no point discussing it.
      - q: Are eighteen heads actually worth it?
        a: >-
          The published 75–84 m²/h band covers every configuration from four heads
          to eighteen, with the lower end being the smaller array. The real return
          on head count is not raw speed but holding that speed at a higher pass
          count — 47–54 m²/h at eight passes. And to be plain about it: eighteen
          KM1024i heads represent a significant share of the machine's value, and
          a failure replaces one head, not the array.
      - q: What changes if I choose Ricoh Gen6 heads instead of Konica?
        a: >-
          Speed drops, drop size shrinks. The same chassis runs 60–72 m²/h at four
          passes with Ricoh Gen6, but the 5 pL drop handles pass banding and skin
          tones better than the 6 pL KM1024i. Volume work belongs on Konica,
          quality-critical work on Ricoh.
      - q: What maintenance does the water cooling add?
        a: >-
          The closed-loop chiller takes a deionised water and glycol change once a
          year, with a filter check every six months. Skip it and the problem does
          not appear in the chiller — it appears in the LED modules, one of the
          most expensive items on the machine.
      - q: What do I need to prepare for floor and power?
        a: >-
          The machine weighs 2580 kg carried on four feet, so the slab must be
          flat to ±3 mm per metre and free of vibration. Electrically it is 220 V
          three-phase at 45 A with a 10 kW peak. The crate is 5900 × 3300 × 1900
          mm — we check door and corridor dimensions with you before the order is
          placed.
      - q: What happens to speed with white and varnish?
        a: >-
          Colour-white-colour work lays down three layers, so output falls to
          roughly a third, and spot varnish adds another pass on top. If clear
          acrylic and dark substrates dominate your mix, plan capacity around that
          lower figure rather than around 75–84 m²/h.
