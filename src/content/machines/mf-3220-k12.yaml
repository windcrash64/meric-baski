i18n:
  tr:
    tagline: Tam boy levhayı tek parçada basar, vardiyayı durdurmadan sürdürür
    summary: >-
      MF-3220 K12, 3200 × 2000 mm tablasıyla tam boy kompozit ve pleksi levhayı
      ekleme yapmadan tek parçada basar. Dört ile on sekiz arasında
      yapılandırılabilen Konica Minolta KM1024i dizilimi, 4 geçişte 75–84 m²/sa
      üretim hızı verir. Altı bağımsız vakum bölgesi, tablanın bir yarısı
      basarken diğer yarısının beslenmesine izin verir; makine gerçek anlamda
      iki operatörle çalışır. Su soğutmalı LED-UV kürleme lamba sıcaklığını
      vardiya boyunca sabit tutar, beyaz kanal sürekli sirkülasyondadır.
    features:
      - term: Bölgesel Vakum Kontrolü
        body: >-
          Tabla altı bağımsız bölgeye ayrılmıştır. Üç bölge basarken diğer üçü
          boşaltılıp yeniden dizilebilir; 3,2 metrelik bir tablada asıl kayıp
          baskı süresinde değil, tablanın boş beklediği dakikalardadır.
      - term: Su Soğutmalı LED-UV
        body: >-
          Hava soğutmalı lambaların aksine sıcaklık vardiya boyunca sabit kalır.
          On sekiz kafalı bir dizilimde kürleme enerjisi de yükseldiği için, su
          soğutma bu sınıfta konfor değil çalışma şartıdır.
      - term: MavenFlow Beyaz Sirkülasyon
        body: >-
          Beyaz mürekkep, makine kapalıyken bile kanal içinde dolaşır. 5 litrelik
          toplu beslemede çöken pigmenti geri kazanmanın yolu yoktur; sirkülasyon
          bu yüzden tank hacmi büyüdükçe daha kritik hale gelir.
      - term: AutoGap Yükseklik Sensörü
        body: >-
          Malzeme yüksekliği 0–100 mm arasında otomatik ölçülür ve kafa boşluğu
          buna göre ayarlanır. Çarpışma sensörü, 3,2 metrelik bir levhanın
          ortasında oluşan kamburu kafa temas ettiği anda yakalar.
      - term: MavenGuard Nozül Kurtarma
        body: >-
          Tıkanan bir nozül, komşu nozüller tarafından telafi edilerek iş
          durdurulmadan tamamlanır. Kurtarma bir onarım değil, vardiyayı bitirme
          yöntemidir: kalıcı çözüm yine kafa temizliği ve filtre bakımıdır.
    faq:
      - q: MF-3220 K12 kimin için doğru, kimin için değil?
        a: >-
          Günlük rijit baskı hacmi 60 m²'nin üzerinde olan, tabela, cephe paneli
          ve mobilya üretimi yapan atölyeler için doğru. Bunun altındaki
          hacimlerde makine kendini ödetmez; MF-2513 R8 hem yatırım hem işletme
          maliyeti olarak daha akıllıcadır. 45 m² boş alan, 3,5 m tavan ve vinçli
          giriş sağlayamıyorsanız da bu makineyi konuşmanın anlamı yok.
      - q: 18 kafanın gerçekten karşılığı var mı?
        a: >-
          Yayınladığımız 75–84 m²/sa bandı 4 kafadan 18 kafaya kadar bütün
          konfigürasyonları kapsar; bandın alt ucu düşük kafa sayısıdır. Kafa
          sayısını artırmanın asıl getirisi ham hız değil, aynı hızı daha yüksek
          geçiş sayısında koruyabilmektir — yani 8 geçişte 47–54 m²/sa. Ayrıca
          şunu açıkça söyleyelim: 18 adet KM1024i, makine bedelinin önemli bir
          bölümünü oluşturur ve arızada bütün dizilim değil, tek kafa değişir.
      - q: Konica yerine Ricoh Gen6 kafa seçsem ne değişir?
        a: >-
          Hız düşer, damla küçülür. Aynı şasi Ricoh Gen6 ile 4 geçişte 60–72
          m²/sa yapar; buna karşılık 5 pL damla, KM1024i'nin 6 pL damlasına göre
          geçiş izlerini ve ten tonlarını daha iyi verir. Hacim işi Konica,
          kalite kritik iş Ricoh tarafındadır.
      - q: Su soğutmanın bakım yükü nedir?
        a: >-
          Kapalı devre soğutucuda deiyonize su ve antifriz karışımı yılda bir
          değişir, filtre altı ayda bir kontrol edilir. Bu bakım atlanırsa sorun
          soğutucuda değil LED modüllerinde çıkar ve makinedeki en pahalı
          kalemlerden birini yenilemek zorunda kalırsınız.
      - q: Zemin ve elektrik için ne hazırlamalıyım?
        a: >-
          Makine 2580 kg ve yükü dört ayağa biner; zeminin metrede ±3 mm
          düzlemde olması ve titreşimsiz bir beton üzerine oturması gerekir.
          Elektrik tarafında 220 V 3 faz, 45 A ve 10 kW tepe tüketimi vardır.
          Nakliye kasası 5900 × 3300 × 1900 mm'dir; kapı ve koridor ölçülerini
          sipariş öncesinde birlikte kontrol ediyoruz.
      - q: Beyaz ve lak kullanınca hız ne oluyor?
        a: >-
          Renk-beyaz-renk işlerde üç katman basıldığı için çıktı yaklaşık üçte
          bire iner; nokta lak eklendiğinde ayrıca bir geçiş daha gelir. Şeffaf
          pleksi ve koyu zeminli işler ağırlıktaysa kapasite planınızı 75–84
          m²/sa üzerinden değil, bu düşük rakam üzerinden yapın.
    alternateName:
