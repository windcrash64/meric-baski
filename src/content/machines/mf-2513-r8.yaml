i18n:
  tr:
    tagline: Her yüzeye endüstriyel kalite, her vardiyaya kesintisiz üretim
    summary: >-
      MF-2513 R8, 2500 × 1300 mm tablasıyla sektörün hacim makinesidir. 2 ile 12
      arasında yapılandırılabilen Ricoh Gen6 kafa dizilimi, 4 geçişte 50–60 m²/sa
      üretim hızı verir; üç bağımsız vakum bölgesi sayesinde tam tabla iş de,
      tek levha da aynı verimle basılır. Beyaz kanal sürekli sirkülasyondadır,
      su soğutmalı LED-UV kürleme ise 24 saat çalışan atölyelerde lamba ömrünü
      ve renk tutarlılığını korur. 100 mm baskı yüksekliği ile cam, ahşap, kompozit
      ve kalın levha aynı tablada, ara işlem olmadan çalışılır.
    features:
      - term: Bölgesel Vakum Kontrolü
        body: >-
          Tabla üç bağımsız bölgeye ayrılmıştır. Tek bir 60 × 40 cm levha için
          bütün tablayı vakumlamak zorunda kalmaz, kompresör yükünü ve elektrik
          tüketimini iş boyutuna göre ayarlarsınız.
      - term: MavenFlow Beyaz Sirkülasyon
        body: >-
          Beyaz mürekkep, makine kapalıyken bile kanal içinde dolaşır. Beyaz
          pigmentin çökmesi ve bunun getirdiği kafa temizleme kaybı, beyaz
          kullanan her atölyenin en büyük gizli maliyetidir.
      - term: AutoGap Yükseklik Sensörü
        body: >-
          Malzeme yüksekliği 0–100 mm arasında otomatik ölçülür ve kafa yüksekliği
          buna göre ayarlanır. Kafa çarpışma sensörü temas anında arabayı durdurur.
      - term: Su Soğutmalı LED-UV
        body: >-
          Hava soğutmalı lambaların aksine sıcaklık vardiya boyunca sabit kalır;
          bu hem kürleme tutarlılığını hem de LED ömrünü doğrudan etkiler.
    faq:
      - q: MF-2513 R8 hangi işler için doğru makine?
        a: >-
          Tabela, levha, cam ve mobilya panel üretimi gibi günlük 40 m²'nin
          üzerinde rijit malzeme basan atölyeler için tasarlandı. Daha düşük
          hacimlerde MF-1216 R4, 3200 × 2000 mm'ye kadar levha basmanız
          gerekiyorsa MF-3220 K12 daha doğru olur.
      - q: Kafa sayısını sonradan artırabilir miyim?
        a: >-
          Evet. Şasi 12 kafaya kadar hazırdır; 4 kafalı bir konfigürasyonu sonradan
          8 kafaya çıkarmak yerinde yapılan bir yükseltmedir. Yükseltme sonrası
          renk profillerinin yeniden oluşturulması gerekir.
      - q: Trifaze elektrik şart mı?
        a: >-
          Evet. Makine 220 V 3 faz, 45 A besleme ister. Panonun makineye kadar
          çekilmesi ve kaçak akım korumasının hazırlanması kurulum öncesi
          sizin tarafınızdadır; kurulum öncesi keşifte birlikte kontrol ediyoruz.
      - q: Beyaz mürekkep tüketimi ne kadar?
        a: >-
          Tam kapatıcı beyaz alt katman kullanıldığında toplam tüketim 10–30 ml/m²
          aralığının üst bandına yaklaşır. Renk + beyaz + renk (C-W-C) işlerde
          hızın da yaklaşık üçte bire düştüğünü hesaba katın.
    alternateName:
      - UV flatbed baskı makinası
      - flatbed uv baskı makinesi
      - 2500x1300 uv baskı makinesi
  en:
    tagline: Industrial quality on any surface, uninterrupted output every shift
    summary: >-
      The MF-2513 R8 is the volume machine of the category, built around a
      2500 × 1300 mm bed. A Ricoh Gen6 array configurable from 2 to 12 heads
      delivers 50–60 m²/h at four passes, and three independent vacuum zones mean
      a single sheet costs no more vacuum than a full bed. The white channel
      circulates continuously, and water-cooled LED-UV curing holds lamp
      temperature steady in shops that run around the clock.
    features:
      - term: Zoned Vacuum Control
        body: >-
          The bed is split into three independent zones, so a single 60 × 40 cm
          sheet does not require pulling vacuum across the whole table. Compressor
          load and power draw scale with the job, not the machine.
      - term: MavenFlow White Circulation
        body: >-
          White ink circulates through the channel even when the machine is idle.
          Settled white pigment — and the head cleaning it causes — is the largest
          hidden cost in any shop running white.
      - term: AutoGap Height Sensor
        body: >-
          Media height is measured automatically between 0 and 100 mm and the head
          gap is set from it. An anti-collision sensor halts the carriage on contact.
      - term: Water-Cooled LED-UV
        body: >-
          Unlike air-cooled lamps, temperature stays constant across a full shift,
          which directly affects both cure consistency and LED service life.
    faq:
      - q: What is the MF-2513 R8 the right machine for?
        a: >-
          Shops printing more than 40 m² of rigid material a day — signage, sheet
          goods, glass and furniture panels. Below that volume the MF-1216 R4 fits
          better; if you need to print sheets up to 3200 × 2000 mm, look at the
          MF-3220 K12.
      - q: Can I add printheads later?
        a: >-
          Yes. The chassis is prepared for up to 12 heads, and going from a
          4-head to an 8-head configuration is an on-site upgrade. Colour profiles
          must be rebuilt afterwards.
      - q: Is three-phase power mandatory?
        a: >-
          Yes — 220 V three-phase at 45 A. Bringing the panel to the machine and
          preparing residual-current protection is your responsibility before
          installation; we walk through it together during the pre-install survey.
      - q: How much white ink does it use?
        a: >-
          With a fully opaque white underbase, total consumption approaches the top
          of the 10–30 ml/m² band. Also budget for speed: colour-white-colour work
          runs at roughly a third of single-pass colour output.
