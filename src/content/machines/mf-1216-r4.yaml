i18n:
  tr:
    tagline: Küçük atölyeye sığan üretim tablası, vardiya başına gerçek levha çıktısı
    summary: >-
      MF-1216 R4, 1200 × 1540 mm tablasıyla tabela ve levha üretimine giren
      atölyeler için ara basamaktır. İki ile dört arasında yapılandırılabilen
      Ricoh Gen6 kafa dizilimi, 4 geçişte 22–28 m²/sa verir; 100 mm baskı
      yüksekliği pleksi, dekota, kompozit ve MDF'yi aynı tablada toplar. Üç
      bağımsız vakum bölgesi küçük parçalarda kompresör yükünü düşürür, beyaz
      kanal sürekli sirkülasyondadır. Şasi dört kafaya kadar hazırdır ve beyaz
      isteyen her konfigürasyon dördüncü kafayı kullanır.
    features:
      - term: Bölgesel Vakum Kontrolü
        body: >-
          Tabla üç bağımsız bölgeye ayrılmıştır. 30 × 40 cm'lik bir levha için
          bütün tablayı vakumlamak zorunda kalmazsınız; blower yükü ve elektrik
          tüketimi makinenin değil, işin boyutuna göre belirlenir.
      - term: MavenFlow Beyaz Sirkülasyon
        body: >-
          Beyaz mürekkep, makine kapalıyken bile kanal içinde dolaşır. Beyaz
          pigmentin çökmesi ve bunun getirdiği kafa temizleme kaybı, beyaz
          kullanan her atölyenin en büyük gizli maliyetidir.
      - term: AutoGap Yükseklik Sensörü
        body: >-
          Malzeme yüksekliği 0–100 mm arasında otomatik ölçülür ve kafa boşluğu
          buna göre ayarlanır. Kafa çarpışma sensörü, kalkmış bir levha köşesine
          temas ettiği anda arabayı durdurur.
      - term: PinLock Kayıt Pimleri
        body: >-
          Tabla köşesindeki mekanik pimler her levhayı aynı orijine oturtur.
          Çift yüz baskıda ve tekrar eden panel işlerinde ikinci yüzü hizalamak
          ölçüm değil, malzemeyi pime dayama işidir.
    faq:
      - q: 2 kafa mı, 4 kafa mı almalıyım?
        a: >-
          Yayınladığımız 22–28 m²/sa bandının alt ucu iki kafa, üst ucu dört
          kafadır. Asıl belirleyici hız değil beyazdır: beyaz kendi kafasını
          ister, dolayısıyla beyaz basacaksanız dört kafalı konfigürasyon
          pratikte zorunludur. Sonradan kafa eklemek mümkündür ama renk
          profillerinin yeniden çıkarılması gerekir.
      - q: Epson kafalı konfigürasyon neden daha uygun fiyatlı?
        a: >-
          Çünkü daha yavaştır. Aynı şasi Epson i3200-U1 kafalarla 4 geçişte
          yaklaşık 15 m²/sa yapar; Ricoh Gen6 ise 22–28 m²/sa. Düşük hacimli ve
          fiyat odaklı bir başlangıç için mantıklı, ama iki vardiya çalışmayı
          planlıyorsanız aradaki fark bir yıl içinde kapanır.
      - q: Bu makinede lak (vernik) kanalı var mı?
        a: >-
          Hayır. Kanallar CMYK + Lc + Lm + beyaz olarak kullanılır; nokta lak,
          kabartma lak ve mat/parlak kontrast işleri bu şasinin dışındadır. Lak
          kanalı gerekiyorsa MF-2513 R8'e bakmalısınız.
      - q: Trifaze elektrik şart mı?
        a: >-
          Evet. Makine 220 V 3 faz, 45 A besleme ister ve tepe tüketimi 10 kW'tır.
          Panonun makineye kadar çekilmesi ile kaçak akım korumasının hazırlanması
          kurulum öncesi sizin tarafınızdadır; ön keşifte birlikte kontrol ediyoruz.
      - q: MF-2513 R8 yerine bunu almak ne zaman doğru olur?
        a: >-
          Günlük rijit baskı hacminiz 25 m²'nin altındaysa ve en büyük levhanız
          1200 × 1540 mm'ye sığıyorsa. Bu iki koşuldan biri bozuluyorsa MF-1216
          R4 kısa sürede darboğaza dönüşür: tabla boyu yüzünden levhayı ekleyerek
          basmak, hız farkından kaybettiğinizden daha pahalıdır.
    alternateName:
      - orta format uv baskı makinası
      - 120x150 uv flatbed baskı makinesi
      - levha uv baskı makinası
      - ricoh kafalı uv baskı makinesi
  en:
    tagline: A production bed that fits a small shop, real sheet output every shift
    summary: >-
      The MF-1216 R4 is the step a shop takes when signage and sheet work turns
      into daily production: a 1200 × 1540 mm bed, 100 mm of print height and a
      Ricoh Gen6 array configurable from two to four heads that delivers
      22–28 m²/h at four passes. Acrylic, foam PVC, composite panel and MDF all
      run on the same table. Three independent vacuum zones keep blower load in
      proportion to the job, and the white channel circulates continuously.
    features:
      - term: Zoned Vacuum Control
        body: >-
          The bed is split into three independent zones. A 30 × 40 cm sheet does
          not require pulling vacuum across the whole table, so blower load and
          power draw follow the size of the job rather than the size of the
          machine.
      - term: MavenFlow White Circulation
        body: >-
          White ink circulates through the channel even when the machine is idle.
          Settled white pigment — and the head cleaning it causes — is the largest
          hidden cost in any shop running white.
      - term: AutoGap Height Sensor
        body: >-
          Media height is measured automatically between 0 and 100 mm and the head
          gap is set from it. The anti-collision sensor halts the carriage the
          moment it touches a lifted sheet corner.
      - term: PinLock Registration Pins
        body: >-
          Mechanical pins on the bed corner return every sheet to the same origin.
          On double-sided and repeat panel work, aligning the second side becomes
          a matter of pushing the sheet against the pins, not measuring it.
    faq:
      - q: Two heads or four?
        a: >-
          The lower end of the published 22–28 m²/h is a two-head machine, the
          upper end four. Speed is not really the deciding factor — white is.
          White needs a head of its own, so if you print white, four heads is
          effectively mandatory. Heads can be added later, but colour profiles
          have to be rebuilt afterwards.
      - q: Why is the Epson head configuration cheaper?
        a: >-
          Because it is slower. The same chassis with Epson i3200-U1 heads runs
          about 15 m²/h at four passes against 22–28 m²/h for Ricoh Gen6. It makes
          sense as a low-volume, price-led entry, but if you plan to run two
          shifts the difference pays for itself inside a year.
      - q: Does this machine have a varnish channel?
        a: >-
          No. The channels are used as CMYK + Lc + Lm + white; spot varnish,
          textured varnish and matt/gloss contrast work are outside this chassis.
          If you need a varnish channel, look at the MF-2513 R8.
      - q: Is three-phase power mandatory?
        a: >-
          Yes — 220 V three-phase at 45 A, with a peak draw of 10 kW. Bringing the
          panel to the machine and preparing residual-current protection is your
          responsibility before installation; we walk through it together during
          the pre-install survey.
      - q: When is this the right choice over the MF-2513 R8?
        a: >-
          When your daily rigid volume stays under 25 m² and your largest sheet
          fits inside 1200 × 1540 mm. If either condition breaks, the MF-1216 R4
          becomes a bottleneck quickly: tiling a sheet because the bed is too
          short costs more than the speed difference ever will.
    alternateName:
      - mid-format uv flatbed printer
      - 1200x1540 uv flatbed printer
      - ricoh gen6 uv flatbed printer
