i18n:
  tr:
    tagline: Masaüstüne sığan endüstriyel UV kalitesi, tek parçadan seri üretime
    summary: >-
      MF-6090 U3, 600 × 900 mm tablası ve 180 mm baskı yüksekliğiyle promosyon,
      hediyelik ve kişiselleştirme işleri için kurulmuş masaüstü bir UV flatbed
      makinesidir. Üç adet Epson i3200-U1 kafa, 4 geçişte 6,5–8 m²/sa üretim hızı
      verir. İki bağımsız vakum bölgesi, tek parça işlerde bütün tablayı emmeyi
      gerektirmez; kalın parçalar ara aparat olmadan doğrudan tablaya oturur.
      Hava soğutmalı LED-UV kürleme baskıyı kafa geçer geçmez sabitler, iş
      tabladan çıktığı anda paketlenebilir.
    features:
      - term: Bölgesel Vakum Kontrolü
        body: >-
          Tabla iki bağımsız bölgeye ayrılmıştır. 10 × 10 cm'lik tek bir parça
          için bütün tablayı emmeye çalışmazsınız; sol bölge işi tutarken sağ
          bölge bir sonraki partiyi dizmek için açık kalır.
      - term: PinLock Kayıt Pimleri
        body: >-
          Tablanın köşesindeki mekanik pimler her işi aynı orijine oturtur. Aynı
          kılıfı ikinci kez basarken hizayı yeniden ölçmezsiniz — tekrar eden
          siparişlerde asıl zaman kaybı baskıda değil, kurulumda olur.
      - term: AutoGap Yükseklik Sensörü
        body: >-
          Malzeme yüksekliği 0–180 mm arasında otomatik ölçülür ve kafa boşluğu
          buna göre ayarlanır. Ölçüm tek noktadan yapıldığı için yüzeyi eğimli
          veya kademeli parçalarda boşluğu operatörün doğrulaması gerekir.
      - term: MavenFlow Beyaz Karıştırma
        body: >-
          Beyaz tank programlı olarak karıştırılır. Bu, büyük makinelerdeki
          sürekli sirkülasyonun yerini tutmaz: makine üç günden uzun beklerse
          beyaz hattın yıkanmasını iş planına dahil edin.
    faq:
      - q: MF-6090 U3 hangi işler için doğru makine?
        a: >-
          Promosyon ürünü, hediyelik eşya, telefon kılıfı, plaket, numune ve
          küçük seri kişiselleştirme için tasarlandı; günlük 8–10 m²'ye kadar
          rahat çalışır. Levha, tabela veya panel üretimi yapacaksanız yanlış
          makine — o iş MF-1216 R4 ile başlar.
      - q: Trifaze elektrik gerekiyor mu?
        a: >-
          Hayır. 220 V tek faz, 3,8 kW, 18 A yeterlidir. Buna karşılık makineye
          ayrı bir hat çekin: kompresörle aynı sigortayı paylaşırsa, kürleme
          lambaları devreye girdiğinde gerilim düşüşü ve baskı hatası görürsünüz.
      - q: Cam, metal ve seramiğe doğrudan basabilir miyim?
        a: >-
          Çoğu durumda evet, ancak yapışma yüzeyin kendisine bağlıdır. Kaplamalı
          cam, anodize alüminyum ve sırlı seramikte primer gerekir. Her yeni
          malzeme partisinde numune basıp 24 saat sonra bant testi yapmanızı
          öneririz; parti değiştiğinde yüzey kimyası da değişir.
      - q: Beyaz mürekkep hızı ne kadar düşürür?
        a: >-
          Yayınladığımız 6,5–8 m²/sa değeri 4 geçiş CMYK içindir. Renk-beyaz-renk
          (C-W-C) işlerde üç kat malzeme basıldığı için çıktı yaklaşık üçte bire
          iner. Şeffaf ve koyu malzeme ağırlıklı çalışıyorsanız kapasiteyi bu
          düşük rakama göre planlayın.
      - q: Baskı kafası ne kadar dayanır?
        a: >-
          Tek vardiya kullanımda ve günlük kapatma prosedürüne uyulduğunda Epson
          i3200-U1 kafalardan tipik olarak 12–18 ay alınır. UV mürekkeple çalışan
          bir kafanın ömrünü belirleyen şey baskı saati değil, beklemede kuruyan
          nozüllerdir; makineyi hafta sonu kapatıp temizlemeden bırakmak en pahalı
          alışkanlıktır.
    alternateName:
      - masaüstü uv baskı makinası
      - 60x90 uv baskı makinesi
      - promosyon uv baskı makinası
      - masaüstü uv yazıcı
  en:
    tagline: Industrial UV quality on a benchtop, from one-offs to short runs
    summary: >-
      The MF-6090 U3 is a benchtop UV flatbed built for promotional, gift and
      personalisation work, with a 600 × 900 mm bed and 180 mm of print height.
      Three Epson i3200-U1 heads deliver 6.5–8 m²/h at four passes. Two
      independent vacuum zones mean a single small part does not require pulling
      vacuum across the whole table, and thick items sit straight on the bed
      without a spacer. Air-cooled LED-UV curing fixes the print as the carriage
      passes, so work can be packed the moment it leaves the bed.
    features:
      - term: Zoned Vacuum Control
        body: >-
          The bed is split into two independent zones. A single 10 × 10 cm part
          does not require vacuum across the whole table — the left zone holds
          the job while the right stays free for laying out the next batch.
      - term: PinLock Registration Pins
        body: >-
          Mechanical pins on the bed corner return every job to the same origin.
          Reprinting the same phone case does not mean re-measuring alignment;
          on repeat orders the time goes into setup, not printing.
      - term: AutoGap Height Sensor
        body: >-
          Media height is measured automatically between 0 and 180 mm and the
          head gap is set from it. Measurement is single-point, so on sloped or
          stepped parts the operator still has to confirm the gap.
      - term: MavenFlow White Agitation
        body: >-
          The white tank is agitated on a schedule. This is not the equivalent of
          continuous circulation on the larger machines: if the printer stands
          idle for more than three days, plan a white line flush.
    faq:
      - q: What is the MF-6090 U3 the right machine for?
        a: >-
          Promotional items, giftware, phone cases, awards, samples and short-run
          personalisation — comfortably up to 8–10 m² a day. If you are producing
          sheet goods, signage or panels it is the wrong machine; that work starts
          at the MF-1216 R4.
      - q: Does it need three-phase power?
        a: >-
          No. Single-phase 220 V, 3.8 kW, 18 A is enough. Do give it a dedicated
          circuit, though: sharing a breaker with a compressor causes voltage dips
          when the curing lamps kick in, and those show up as print defects.
      - q: Can it print directly onto glass, metal and ceramic?
        a: >-
          Usually yes, but adhesion depends on the surface itself. Coated glass,
          anodised aluminium and glazed ceramic need primer. Test-print each new
          batch of material and run a tape test after 24 hours — surface chemistry
          changes with the batch, not just with the material.
      - q: How much does white ink cost in speed?
        a: >-
          The published 6.5–8 m²/h is four-pass CMYK. Colour-white-colour work
          lays down three layers, so output drops to roughly a third. If your mix
          is mostly clear and dark substrates, plan capacity around the lower
          figure.
      - q: How long do the printheads last?
        a: >-
          On single-shift use with the daily shutdown routine followed, expect
          12–18 months from an Epson i3200-U1. What kills a UV head is not print
          hours but nozzles drying while the machine stands — leaving it over a
          weekend without capping and cleaning is the most expensive habit in the
          shop.
    alternateName:
      - desktop uv printer 60x90
      - benchtop uv flatbed printer
      - uv printer for promotional products
