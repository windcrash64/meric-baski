i18n:
  tr:
    tagline: Vardiyalık branda hızı, sarma öncesi tam kuruyan baskı
    summary: >-
      MS-1802 E4, 1,8 metre eko solvent rulo makinesidir; dört adet Epson i3200-E1
      kafayla dört geçişte 79 m²/sa üretim, altı geçişte 54 m²/sa standart hız verir.
      Üç kademeli ısıtma hattı — ön ısıtma, tabla ve son kurutma — brandayı ve ışıklı
      vinili sarma öncesi kurutur, böylece rulo kendi üzerine yapışmaz. Monofaze 25 A
      besleme ile çalışır. Bu makine bir tabela atölyesinin günlük iş makinesidir;
      rijit levha basmaz, bunun için hibrit tarafa bakın.
    features:
      - term: TriZone Isı Hattı
        body: >-
          Ön ısıtma, tabla ve son kurutma bölgeleri ayrı ayrı ayarlanır. Branda ile
          ışıklı vinil aynı sıcaklık profilini kaldırmaz; tek bölgeli ısıtıcılarda
          çözüm hızı düşürmekken burada çözüm bölge sıcaklığını değiştirmektir.
      - term: TensionLock Rulo Gergi
        body: >-
          Açma ve sarma motorları gergi kolundan geri besleme alır. Rulo çapı düştükçe
          gerginlik sabit kalır; 60 kg'lık bir bobinin sonuna doğru ortaya çıkan
          kayma ve buna bağlı kayıt hatası ortadan kalkar.
      - term: SmartCap Kafa İstasyonu
        body: >-
          Makine beklemeye geçtiğinde kafalar otomatik olarak kapaklanır ve
          nemlendirilir. Eko solvent mürekkepte tıkanmanın büyük kısmı baskı
          sırasında değil, kapatılmadan bırakılan hafta sonlarında olur.
      - term: MavenDrop Değişken Damla
        body: >-
          3–25 pL arasında değişken damla, 1440 × 2400 dpi'a kadar. Yakından okunan
          araç yazısı ile on metreden bakılan branda aynı kafayla, farklı damla
          profiliyle basılır — mürekkep tüketimi de bu profile göre değişir.
    faq:
      - q: MS-1802 E4 hangi işler için doğru, hangileri için yanlış makine?
        a: >-
          Branda, vinil, mesh, kanvas ve duvar kağıdı hacmi olan tabela atölyeleri
          için doğru. Beyaz mürekkebe veya rijit levha baskısına ihtiyacınız varsa
          yanlış: bu makine CMYK bir rulo makinesidir. Beyaz için MS-1600 PC'ye,
          levha için MH-1800 U4'e bakın.
      - q: 79 m²/sa hangi şartlarda ölçülüyor?
        a: >-
          Dört geçişte, branda üzerine, orta kaplama alanında. Sözleşme kalitesinde
          iş için gerçek çalışma modu altı geçiş ve 54 m²/sa'dır. Sekiz geçiş,
          yalnızca yakından okunan dekor ve araç işlerinde gereklidir; oradaki
          39 m²/sa rakamını da tabloda açıkça yazıyoruz.
      - q: Havalandırma zorunlu mu?
        a: >-
          Zorunlu değil, ama "kokusuz" da değil. Eko solvent, gerçek solvente göre
          çok düşük emisyonludur; yine de son kurutucunun üzerine yerel emiş
          koymanızı ve makinenin bulunduğu odada saatte birkaç kez hava değişimi
          sağlamanızı öneriyoruz. Operatörün gün boyu oturduğu bir ofisin içine
          koymayın.
      - q: Isıtıcılar elektrik faturasını ne kadar etkiler?
        a: >-
          4,5 kW'lık toplam tüketimin yaklaşık 3 kW'ı üç ısıtıcı bölgesine aittir.
          Isıtıcılar termostatlı çalıştığı için sürekli tam güç çekmez, ancak soğuk
          bir atölyede kış aylarında çekiş süresi uzar. Makineyi 20 °C'nin altındaki
          bir mekâna koyarsanız hem tüketim hem de kuruma süresi artar.
      - q: Tank sistemi mi kartuş mu daha iyi?
        a: >-
          Litre başına maliyette tank açık ara önde ve bu makine tanklıdır. Bedeli
          bakımdır: damperler yaklaşık altı ayda bir, hat filtreleri yılda bir
          değişir ve tank hiçbir zaman tamamen boşaltılmadan doldurulmaz. Bu bakımı
          yapmayacaksanız kartuşlu bir makine size daha ucuza gelir.
    alternateName:
      - ekosolvent baskı makinası
      - 1.8 m eko solvent baskı makinesi
      - 180 cm dijital baskı makinası
      - 4 kafa i3200 eko solvent yazıcı
  en:
    tagline: A shift's worth of banner, dry before it reaches the take-up
    summary: >-
      The MS-1802 E4 is a 1.8 m eco-solvent roll printer: four Epson i3200-E1 heads
      give 79 m²/h in production at four passes and 54 m²/h standard at six. A
      three-stage heat path — pre-heat, platen and post-dry — takes banner and backlit
      vinyl dry onto the take-up, so the roll does not block against itself. It runs
      single-phase at 25 A. This is a sign shop's daily workhorse; it does not print
      rigid sheet, and the hybrid range covers that.
    features:
      - term: TriZone Heat Path
        body: >-
          Pre-heat, platen and post-dry are set independently. Banner and backlit vinyl
          do not tolerate the same temperature profile; on a single-zone heater the fix
          is to slow down, here the fix is to change one zone.
      - term: TensionLock Roll Tension
        body: >-
          Unwind and rewind motors take feedback from the dancer arm, so pull stays
          constant as the roll loses diameter. The slip — and the registration error it
          causes — that shows up near the end of a 60 kg reel disappears.
      - term: SmartCap Head Station
        body: >-
          Heads cap and humidify automatically as soon as the machine goes idle. Most
          eco-solvent clogging does not happen while printing; it happens over weekends
          when the heads were left uncapped.
      - term: MavenDrop Variable Drop
        body: >-
          Variable drop from 3 to 25 pL, up to 1440 × 2400 dpi. Vehicle lettering read
          from arm's length and banner read from ten metres come off the same head with
          different drop profiles — and different ink consumption.
    faq:
      - q: What is the MS-1802 E4 right for, and what is it wrong for?
        a: >-
          Right for sign shops with volume in banner, vinyl, mesh, canvas and
          wallcovering. Wrong if you need white ink or rigid sheet: this is a CMYK roll
          machine. For white look at the MS-1600 PC, for sheet at the MH-1800 U4.
      - q: Under what conditions is 79 m²/h measured?
        a: >-
          Four passes, on banner, at moderate coverage. For contract-quality work the
          real operating mode is six passes and 54 m²/h. Eight passes are only needed
          for decor and vehicle work read close up, and we publish that 39 m²/h figure
          in the table rather than hiding it.
      - q: Is ventilation mandatory?
        a: >-
          Not mandatory — but "odourless" is not the same as low odour. Eco-solvent
          emits far less than true solvent, yet we still recommend local extraction over
          the post-heater and a few air changes an hour in the room. Do not put it in an
          office where someone sits all day.
      - q: How much do the heaters add to the electricity bill?
        a: >-
          Roughly 3 kW of the 4.5 kW total belongs to the three heater zones. They are
          thermostatic, so they do not draw full power continuously, but in a cold shop
          the duty cycle lengthens through winter. Installed below 20 °C, both
          consumption and drying time go up.
      - q: Bulk tank or cartridge?
        a: >-
          Per litre, bulk wins clearly, and this machine is bulk-fed. The price is
          maintenance: dampers roughly every six months, line filters yearly, and never
          topping a tank up before it has been run down. If you will not do that
          maintenance, a cartridge machine costs you less overall.
