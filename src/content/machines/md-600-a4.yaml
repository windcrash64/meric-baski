# machine, not an accessory — so it lives here, not as a separate SKU.
components:
  - sku: MD-600-SH
    name:
      tr: MD-600 SH dikey toz serpme ünitesi
      en: MD-600 SH vertical powder shaker
    role:
      tr: >-
        Basılan filme sıcak eriyik tozu serper, fazlasını eleyip geri kazanır ve
        tozu dikey fırında eritir. Filmi yazıcıdan sarma miline kesintisiz taşır.
      en: >-
        Applies hot-melt powder to the printed film, sieves and recovers the
        excess, then melts it in the vertical oven before the take-up shaft.
    specs:
      dimensions: "1652 × 1066 × 902 mm"
      powerSupply: "AC 220 V, 50/60 Hz, 20 A"
