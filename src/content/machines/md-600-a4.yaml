i18n:
  tr:
    tagline: Baskıdan fırına tek hat, vardiya boyunca aynı transfer kalitesi
    summary: >-
      MD-600 A4, baskı, toz serpme ve fırını tek hatta toplayan 60 cm'lik bir DTF
      sistemidir. Dört adet Epson i3200-A1 kafa, 4 geçişte 12 m²/sa film çıkarır;
      6 geçişte 8, 8 geçişte 6 m²/sa. Beyaz kanal sürekli sirkülasyondadır. Dikey
      toz serpme ünitesi fazla tozu geri kazanır, entegre duman filtresi fırın
      çıkışını atölye havasından ayırır. Rulodan ruloya çalışır; vardiya boyunca
      operatör müdahalesi film değişimiyle sınırlıdır. Sistem 220 V tek fazla
      çalışır, ancak fırın hattı için ayrı 20 A besleme ister.
    features:
      - term: QuadArray Kafa Dizilimi
        body: >-
          Dört Epson i3200-A1 kafa, beyaz iki kafaya paylaştırılacak şekilde
          dizilir. Beyazın tek kafada toplandığı iki kafalı makinelerde alt katman
          hızı yarıya düşer; burada renk ve beyaz aynı geçişte tamamlanır.
      - term: MavenFlow Beyaz Sirkülasyon
        body: >-
          Beyaz mürekkep, makine kapalıyken bile kanal içinde dolaşır. DTF beyazı
          pigment yükü en yüksek mürekkeptir; çökeldiğinde önce nozül kaybı,
          sonra damper ve kafa değişimi olarak geri döner.
      - term: PowderLine Dikey Serpme
        body: >-
          Toz, filme dikey hatta serpilir; fazlası elenip hazneye geri döner.
          Yatay serpme ünitelerinde film kenarında biriken toz, transferde
          görünen sert kenar izinin en yaygın sebebidir.
      - term: CleanCure Duman Filtresi
        body: >-
          Fırın çıkışı filtreden geçirilir ve dış atım kanalına verilir. Filtre
          kartuşu sarf malzemedir; üç vardiya çalışan bir atölyede ortalama
          dört ayda bir değişir.
      - term: TensionTrack Gergi Kontrolü
        body: >-
          Besleme ve sarma milleri gergiyi sabit tutar. PET film ısındığında
          uzar; gergi sabit değilse renk ile beyaz katman arasında kayma olur ve
          transferde beyaz kenar taşar.
    faq:
      - q: MD-600 A4 hangi işler için doğru makine?
        a: >-
          Günde 200–800 arası transfer çıkaran, karışık ve küçük adetli tekstil
          işi yapan atölyeler için. Günde 100 transferin altındaysanız 30 cm'lik
          bir sistem daha doğru; tek desenden binlerce adet basıyorsanız serigrafi
          hâlâ daha ucuz. DTF, adet başına maliyeti değil kurulum süresini
          sıfırlayan bir teknolojidir.
      - q: Yazıcıyı toz serpme ünitesi olmadan alabilir miyim?
        a: >-
          Hayır. Toz serpme ve eritme olmadan basılan film transfer edilemez;
          yazıcı tek başına yarım makinedir. Ünite ayrı bir SKU olarak değil,
          sistemin parçası olarak fiyatlandırılır ve birlikte kurulur.
      - q: Havalandırma şart mı?
        a: >-
          Evet. Entegre duman filtresi kokuyu azaltır ama dış atımın yerini
          tutmaz; fırın çıkışı mutlaka dışarı verilmelidir. Kanal ve baca işi
          size aittir, kurulum öncesi keşifte birlikte planlıyoruz. Penceresi
          olmayan bir bodrumda bu sistemi kurmayın.
      - q: Beyaz mürekkebi ne kadar sürede tüketmeliyim?
        a: >-
          DTF beyazının raf ömrü açılmamış hâlde 6 aydır — renklerin yarısı.
          Aylık tüketiminizin en fazla iki katı kadar stok tutun. Makine hafta
          sonu kapalı kalacaksa sirkülasyonu açık bırakın; kapalı bir sistemde
          beyaz iki günde çökmeye başlar.
      - q: 12 m²/sa gerçek üretim hızı mı?
        a: >-
          Bu, film tarafındaki 4 geçiş hızıdır. Gerçek hat hızını fırın ve toz
          eritme belirler; kalın toz ve yüksek kaplama oranında hat 8–9 m²/sa'ya
          iner. Ayrıca her işte beyaz alt katman basıldığını unutmayın — DTF'de
          beyazsız iş yoktur.
      - q: Toz serpme ünitesini nasıl yerleştirmeliyim?
        a: >-
          Ünite yaklaşık 70 kg ve 1652 × 1066 × 902 mm; iki kişi kaldıramaz,
          transpalet gerekir. Yazıcı ile arasında film hattı düz kalmalı, bu
          yüzden ikisi aynı hizada ve aynı zemin kotunda durmalıdır. Toplam
          9 m² alan ve arkada 60 cm servis boşluğu planlayın.
    alternateName:
      - DTF baskı makinası
      - 60 cm dtf yazıcı
      - film transfer baskı makinesi
      - toz serpme üniteli dtf makinası
  en:
    tagline: One line from print to oven, the same transfer quality every shift
    summary: >-
      The MD-600 A4 is a 60 cm DTF system that puts printer, powder shaker and
      oven on a single line. Four Epson i3200-A1 heads produce 12 m²/h of film at
      four passes, 8 m²/h at six and 6 m²/h at eight. The white channel
      circulates continuously, the vertical shaker recovers excess powder, and an
      integrated fume filter keeps the oven exhaust out of the shop air. It runs
      roll to roll on single-phase 220 V, but the shaker needs its own 20 A feed.
    features:
      - term: QuadArray Head Layout
        body: >-
          Four Epson i3200-A1 heads are arranged so white is split across two of
          them. On two-head machines where white sits on a single head, underbase
          speed halves; here colour and white finish in the same pass.
      - term: MavenFlow White Circulation
        body: >-
          White ink circulates through the channel even when the machine is idle.
          DTF white carries the heaviest pigment load of any ink here — once it
          settles you pay for it in nozzles first, then dampers and heads.
      - term: PowderLine Vertical Shaker
        body: >-
          Powder is applied on a vertical path and the excess is sieved back into
          the hopper. Powder building up at the film edge — the usual failure of
          horizontal shakers — is what leaves a hard visible edge on the transfer.
      - term: CleanCure Fume Filter
        body: >-
          Oven exhaust passes through a filter before it reaches the duct. The
          cartridge is a consumable; in a three-shift shop budget for a change
          roughly every four months.
      - term: TensionTrack Tension Control
        body: >-
          Feed and take-up shafts hold web tension constant. PET film stretches
          as it heats, and inconsistent tension shifts the colour layer against
          the white — which shows up as white bleeding past the edge of the print.
    faq:
      - q: What is the MD-600 A4 the right machine for?
        a: >-
          Shops running 200–800 transfers a day across mixed, short-run apparel
          work. Below 100 transfers a day a 30 cm system fits better; above a few
          thousand pieces of one design, screen printing is still cheaper. DTF
          removes setup time, not unit cost.
      - q: Can I buy the printer without the shaker?
        a: >-
          No. Film printed without powder application and melting cannot be
          transferred, so the printer alone is half a machine. The shaker is
          priced and commissioned as part of the system, not as a separate SKU.
      - q: Is extraction mandatory?
        a: >-
          Yes. The integrated fume filter reduces odour but does not replace
          extraction — the oven exhaust must be ducted outside. Ducting is your
          scope, planned together during the pre-install survey. Do not put this
          system in a basement with no outside wall.
      - q: How fast should I turn over white ink?
        a: >-
          DTF white has a 6-month unopened shelf life, half that of the colours.
          Hold no more than twice your monthly usage. If the machine sits over a
          weekend, leave circulation running; in a static system white starts to
          settle within two days.
      - q: Is 12 m²/h a real production figure?
        a: >-
          It is the four-pass figure on the film side. Real line speed is set by
          the powder melt: at heavy coverage with coarse powder the line drops to
          8–9 m²/h. Remember every job carries a white underbase — there is no
          DTF work without it.
      - q: How should the shaker be positioned?
        a: >-
          It weighs about 70 kg at 1652 × 1066 × 902 mm — a pallet truck job, not
          a two-person lift. The film path between printer and shaker must stay
          straight, so both units sit in line and at the same floor level. Plan
          9 m² in total plus 60 cm of service access behind.
    alternateName:
      - DTF printer 60 cm
      - direct to film printing system
      - DTF printer with powder shaker
