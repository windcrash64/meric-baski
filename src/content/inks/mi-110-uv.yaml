sku: MI-110
series: Maven MI-110 UV
family: uv
type: ink
order: 10
featured: false

# Cıva buharlı (Hg) lambalı kurulu park için. Nazdar 730 sınıfının Türkiye
# karşılığı; geçiş yıkama ister, bu yüzden `switch-and-swap`.
oemEquivalent:
  - Nazdar 730 Serisi
  - Fujifilm Uvijet KV
  - Agfa Anuvia 1401
changeover: switch-and-swap

# Nazdar 730'un gerçek kanal yapısı: 10 kanal stokta, yeşil ve mor talebe bağlı.
channels:
  - { code: C, sku: MI-110-C, availability: stock }
  - { code: M, sku: MI-110-M, availability: stock }
  - { code: Y, sku: MI-110-Y, availability: stock }
  - { code: K, sku: MI-110-K, availability: stock }
  - { code: Lc, sku: MI-110-LC, availability: stock }
  - { code: Lm, sku: MI-110-LM, availability: stock }
  - { code: Lk, sku: MI-110-LK, availability: stock }
  - { code: Or, sku: MI-110-OR, availability: stock }
  - { code: W, sku: MI-110-W, availability: stock }
  - { code: Cl, sku: MI-110-CL, availability: stock }
  - { code: Gr, sku: MI-110-GR, availability: on-request }
  - { code: Vt, sku: MI-110-VT, availability: on-request }

