sku: MI-710
series: Maven MI-710 DTF
family: dtf
type: ink
order: 90
featured: true

# DTF has no OEM ink standard. Every 60 cm system on the market is an open,
# bulk-fed machine built around the same Epson head, so there is nothing to be
# "equivalent" to. An invented equivalence here would be the fastest way to
# lose a technical buyer.
oemEquivalent: []
changeover: switch-and-swap

channels:
  - { code: C, sku: MI-710-C, availability: stock }
  - { code: M, sku: MI-710-M, availability: stock }
  - { code: Y, sku: MI-710-Y, availability: stock }
  - { code: K, sku: MI-710-K, availability: stock }
  - { code: W, sku: MI-710-W, availability: stock }

packaging:
  - format: bottle
    volume: 1
    unit: L
    note: { tr: CMYK kanalları, en: CMYK channels }
  - format: pouch
    volume: 900
    unit: ml
    note:
      tr: >-
        yalnızca beyaz; küçük hacim bilerek seçildi, altı aylık raf ömrüne göre
        ölçülendirildi
      en: >-
        white only; the smaller volume is deliberate, sized to the six-month
        shelf life

compat:
  printheads: [Epson i3200-A1, Epson i1600-A1, Epson XP600]
  dropSizePl: [2.5, 12]
  machines: [MD-600-A4]
  thirdPartyPrinters:
    - LINKO S60 Pro
    - Audley 60 cm i3200-A1
    - PO-TRY 60 cm 5 kafa
  chipIncluded: false

specs:
  cure:
    method: heat
    transferTempC: [150, 160]
    transferSeconds: [10, 15]
  shelfLifeMonths: 12
  shelfLifeNote:
    tr: >-
      Açılmamış ambalajda, 5–30 °C arasında ve doğrudan güneş görmeyen bir
      depoda 12 ay. Beyaz kanal istisnadır: pigment yükü ve çökelme eğilimi
      nedeniyle beyaz 6 ay üzerinden planlanmalıdır — 900 ml ambalaj tam olarak
      bu yüzden vardır. Açılan ambalajı 90 gün içinde bitirin.
    en: >-
      12 months unopened, stored between 5 and 30 °C out of direct sunlight.
      White is the exception: its pigment load and settling behaviour put it on
      a 6-month clock, which is exactly why it ships in 900 ml. Once opened,
      use a container within 90 days.
  storageTempC: [5, 30]
  operatingTempC: [20, 30]
  operatingHumidityPct: [40, 60]
  viscosityCps: { value: 4.0, tolerance: 0.5, atC: 25 }
  surfaceTensionDyn: { value: 30, tolerance: 3 }
  ph: { value: 9.0, tolerance: 0.5 }
  particleSizeNm: [100, 250]
  fastness:
    - { standard: "ISO 105-C06", result: "≥ 4" }
    - { standard: "ISO 105-X12", result: "4–5" }

substrates: [film, textile, leather]
applications: [textile]

# ECO PASSPORT and ZDHC are issued to the producing plant, never to a dealer.
# We send the current certificate against a batch number instead of rendering
# a mark we do not own. See the FAQ.
certifications: []

