    - Beyaz kanalında sirkülasyon bulunan direkt tekstil rulo hatları
  chipIncluded: false

specs:
  cure:
    method: heat
    fixationC: 160
    transferSeconds: [60, 90]
  shelfLifeMonths: 12
  shelfLifeNote:
    tr: >-
      Açılmamış ambalajda, 5–30 °C arasında ve doğrudan güneş görmeyen bir
      depoda 12 ay. Beyaz kanal istisnadır ve 6 ay üzerinden planlanmalıdır;
      tekstil beyazı buradaki en yüksek pigment yüklü mürekkeptir. Açılan
      ambalajı 90 gün içinde bitirin.
    en: >-
      12 months unopened, stored between 5 and 30 °C out of direct sunlight.
      White is the exception and should be planned on a 6-month clock — textile
      white carries the heaviest pigment load in this range. Use an opened
      container within 90 days.
  storageTempC: [5, 30]
  operatingTempC: [18, 30]
  operatingHumidityPct: [40, 60]
  viscosityCps: { value: 4.5, tolerance: 0.5, atC: 25 }
  surfaceTensionDyn: { value: 32, tolerance: 3 }
  ph: { value: 8.5, tolerance: 0.5 }
  particleSizeNm: [100, 250]
  fastness:
    - { standard: "ISO 105-C06", result: "≥ 4" }
    - { standard: "ISO 105-X12", result: "3–4" }
    - { standard: "ISO 105-E04", result: "4" }

