specs:
  # Süblimasyon mürekkebi yazıcıda kurumaz, kalenderde transfer olur. Sıcaklık ve
  # süre aralığı kumaşa göre değişir; A–D sınıfları bu aralığın içindedir.
  cure:
    method: calender
    transferTempC: [180, 220]
    transferSeconds: [30, 180]
  # Süblimasyonda raf ömrü 12 değil 15 aydır — dispers boya dispersiyonu
  # eko solvent ve UV kimyalarından daha kararlıdır.
  shelfLifeMonths: 15
  shelfLifeNote:
    tr: "açılmamış ambalajda ve 25 °C altında; açıldıktan sonra 6 ay içinde tüketin"
    en: "unopened and below 25 °C; use within 6 months once opened"
  storageTempC: [10, 25]
  operatingTempC: [18, 30]
  operatingHumidityPct: [35, 65]

  # Süblimasyonda dış mekân ayı yerine haslık yayımlanır; tekstil alıcısının
  # kendi müşterisine göstereceği veri budur.
  fastness:
    - { standard: "EN ISO 105-B02", result: "4–5" }
    - { standard: "EN ISO 105-C10", result: "≥ 4" }
    - { standard: "EN ISO 105-E04", result: "≥ 4" }

