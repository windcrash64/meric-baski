i18n:
  tr:
    role: Epson i3200-E1, DX5, DX7 ve XP600 kafalı makineler için düşük kokulu eko solvent
    summary: >-
      MI-410 ECO, Epson i3200-E1, DX5, DX7 ve XP600 kafalı makineler için üretilen
      düşük kokulu bir eko solvent mürekkeptir. Mimaki SS21, Mimaki BS4 ve Roland
      ECO-SOL MAX 2 kullanan atölyeler için toplu ambalajlı alternatiftir: 1 litre
      şişe, 2 litre torba, 440 ve 500 ml doldurulabilir kartuş. Renk skalası CMYK;
      açık camgöbeği ile açık macenta stokta, turuncu talebe bağlıdır. Laminesiz
      dikey maruziyette 24 ay dış mekân dayanımı verir. MS-1802 E4 ve MS-1600 PC
      üzerinde doğrulanmıştır; başka bir mürekkepten geçişte hat yıkaması gerekir.
    features:
      - >-
        LowOdour LO-2 Çözücü Paketi — Kapalı atölyede vardiya boyunca çalışan
        operatör için düşük buhar basınçlı çözücülerle formüle edilmiştir. Gerçek
        solventin kokusunu vermez; buna karşılık son ısıtıcının üzerinde yerel emiş
        hâlâ önerilir. Koku duymamak, havalandırmanın gereksiz olduğu anlamına gelmez.
      - >-
        TripleFilter Üretim Hattı — Mürekkep dolumdan önce üç kademede, son kademede
        1 µm'ye kadar filtrelenir ve gazı alınır. Kafa tıkanmalarının çoğu pigment
        partikülünden değil, hatta kalan hava kabarcığından çıkar; degazaj bu yüzden
        filtreleme kadar belirleyicidir.
      - >-
        ColorLock Lot Tutarlılığı — Her üretim lotu referans standardına karşı ölçülür
        ve lotlar arası fark ortalama ΔE ≤ 1,0 bandında tutulur. Aynı tabelayı altı ay
        sonra tamamlayan atölye için önemli olan tek spesifikasyon budur.
      - >-
        OpenPack Ambalaj Seçimi — Aynı mürekkep 1 L şişe, 2 L torba ve 440/500 ml
        doldurulabilir kartuş gövdesinde verilir. Tanklı makinede torba, kartuşlu
        makinede gövde kullanılır; litre maliyeti torbada en düşük, şişede en
        yüksektir.
      - >-
        OutGas 24 Penceresi — Baskı sarma milinden çıktıktan sonra çözücünün büyük
        kısmı ilk 24 saatte uçar. Laminasyonu veya araç aplikasyonunu bu süreden önce
        yaparsanız folyo altında kabarcık ve yapışma kaybı görürsünüz.
    disclaimer: >-
      Yapışma, dış mekân dayanımı ve renk sonuçları malzemenin markasına, yüzey
      kaplamasına ve baskı koşullarına göre değişir. Buradaki değerler kontrollü
      koşullarda alınmış tipik sonuçlardır; taahhüt değildir. Seri üretime başlamadan
      önce kendi malzemenizde, kendi baskı profilinizle ve tercihen aynı lotla test
      edin. Başka bir mürekkepten geçişte hattın, damperlerin ve kafaların MI-910
      FLUSH ile yıkanması şarttır. Sorumluluğumuz her hâlükârda teslim edilen malın
      bedeliyle sınırlıdır.
    faq:
      - q: MI-410 ECO ile MI-420 ECO-TR arasındaki fark nedir?
        a: >-
          Kimya aynı ailedendir; ayrım ambalajda ve renk hedefindedir. MI-410 toplu
          ambalajda verilir ve kendi renk hedefine göre profillenir, yani makinenizde
          ICC profilini yeniden çıkarmanız gerekir. MI-420 ise OEM kartuş ve poşet
          formatlarında, çipli ve OEM profiline eşlenmiş gelir. Tanklı makineniz varsa
          MI-410, kartuşlu bir Roland veya Mutoh'unuz varsa MI-420 doğru olandır.
      - q: Neden "Yıkama gerekir" sınıfında?
        a: >-
          Önceki mürekkebin reçine ve çözücü paketi farklıysa iki mürekkep hat içinde
          karışırken jelleşebilir. Geçişte kanal başına yaklaşık 150–200 ml MI-910
          FLUSH ile hat, damper ve kafa yıkanır; pratikte yarım günlük duruş demektir.
          Aynı aile içinde kalıyorsanız, yani MI-410 ile MI-420 arasında geçiş
          yapıyorsanız yıkama gerekmez.
      - q: Bu seride beyaz mürekkep var mı?
        a: >-
          Yok. MS-1600 PC beyaz kanalı destekler, ancak beyazı OEM tarafından tedarik
          etmeniz veya kanalı boş bırakmanız gerekir. Eko solvent beyazın çökelme ve
          tıkanma davranışı, sürekli sirkülasyonu olmayan makinelerde bizim kabul
          edeceğimiz riskin üzerinde; bu yüzden katalogda taşımıyoruz.
      - q: Bir litre kaç metrekare basar?
        a: >-
          Orta kaplamalı, dört geçişlik bir işte 1 litre yaklaşık 90–120 m² kaplar.
          Tam kaplama fotoğraf işlerinde bu rakam 60 m²'ye kadar düşer, yazı ağırlıklı
          işlerde 150 m²'nin üzerine çıkar. Teklif hazırlarken kendi ortalama kaplama
          oranınızı ölçün; mürekkep bütçenizin tamamını bu tek sayı belirler.
      - q: Laminasyona ne zaman girebilirim?
        a: >-
          Baskıdan sonra en az 24 saat bekleyin. Çözücünün büyük kısmı ilk gün uçar;
          erken lamine edilen işlerde folyo altında kabarcık, araç aplikasyonunda ise
          yapışma kaybı görülür. Isıtıcı sıcaklığını yükseltmek bu süreyi kısaltmaz,
          yalnızca yüzeyi kurutur.
  en:
    role: Low-odour eco-solvent for machines running Epson i3200-E1, DX5, DX7 and XP600 heads
    summary: >-
      MI-410 ECO is a low-odour eco-solvent ink made for machines running Epson
      i3200-E1, DX5, DX7 and XP600 heads. For shops on Mimaki SS21, Mimaki BS4 or
      Roland ECO-SOL MAX 2 it is the bulk-packaged alternative: 1 L bottle, 2 L bag
      and 440 or 500 ml refillable cartridges. The set is CMYK, with light cyan and
      light magenta held in stock and orange to order. Unlaminated vertical exposure
      gives 24 months outdoors. Validated on the MS-1802 E4 and MS-1600 PC; switching
      from another ink requires a line flush.
    features:
      - >-
        LowOdour LO-2 Solvent Package — Formulated with low vapour-pressure solvents
        for an operator who sits next to the machine for a whole shift. It does not
        smell like true solvent, but local extraction over the post-heater is still
        recommended. Not smelling it is not the same as not needing ventilation.
      - >-
        TripleFilter Production Line — Ink is filtered in three stages, down to 1 µm
        at the last, and degassed before filling. Most head blockages come not from
        pigment particles but from air left in the line, which is why degassing
        matters as much as filtration.
      - >-
        ColorLock Batch Consistency — Every production batch is measured against the
        reference standard and batch-to-batch variation is held at an average
        ΔE ≤ 1.0. For a shop completing the same sign six months later, that is the
        only specification that matters.
      - >-
        OpenPack Format Choice — The same ink ships as a 1 L bottle, a 2 L bag and a
        440/500 ml refillable cartridge body. Tank machines take the bag, cartridge
        machines the body; cost per litre is lowest in the bag and highest in the
        bottle.
      - >-
        OutGas 24 Window — Most of the solvent leaves the print in the first 24 hours
        after it comes off the take-up. Laminate or apply to a vehicle before that and
        you will see bubbles under the film and a loss of adhesion.
    disclaimer: >-
      Adhesion, outdoor durability and colour results vary with the brand of media,
      its surface coating and your printing conditions. The figures here are typical
      results obtained under controlled conditions, not a guarantee. Test on your own
      media, with your own print profile and preferably from the same batch, before
      committing to production. When switching from another ink, flushing the lines,
      dampers and heads with MI-910 FLUSH is mandatory. Our liability is in all cases
      limited to the value of the goods supplied.
    faq:
      - q: What is the difference between MI-410 ECO and MI-420 ECO-TR?
        a: >-
          Same chemistry family; the difference is packaging and colour target. MI-410
          is supplied in bulk and is profiled to its own colour target, so you rebuild
          the ICC profile on your machine. MI-420 comes in OEM cartridge and pouch
          formats, chipped and matched to the OEM profile. If you run a tank machine,
          MI-410 is right; if you run a cartridge-fed Roland or Mutoh, MI-420 is.
      - q: Why is it classed "Switch & Swap"?
        a: >-
          If the previous ink used a different resin and solvent package, the two can
          gel as they mix in the line. Changeover means flushing lines, dampers and
          heads with roughly 150–200 ml of MI-910 FLUSH per channel — in practice half
          a day of downtime. Moving within the family, between MI-410 and MI-420, no
          flush is needed.
      - q: Is white available in this series?
        a: >-
          No. The MS-1600 PC supports a white channel, but you would have to source
          white from the OEM or leave the channel empty. Eco-solvent white settles and
          blocks in machines without continuous circulation, and that is more risk than
          we are willing to put in the catalogue.
      - q: How many square metres does a litre print?
        a: >-
          At moderate coverage in a four-pass job, one litre covers roughly 90–120 m².
          On full-coverage photographic work it drops towards 60 m², and on text-led
          work it goes past 150 m². Measure your own average coverage when quoting;
          that single number decides your whole ink budget.
      - q: When can I laminate?
        a: >-
          Wait at least 24 hours after printing. Most of the solvent leaves on the
          first day; laminating early gives bubbles under the film and poor adhesion on
          vehicle applications. Raising the heater temperature does not shorten the
          wait — it only dries the surface.
